
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KK World | Professional ID Card Generator</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#080d1b;
  --surface:#111a2d;
  --border:#26334d;
  --blue:#2563eb;
  --cyan:#38bdf8;
  --text:#f8fafc;
  --muted:#94a3b8;
}

body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:25px;
}

.container{max-width:1250px;margin:auto}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:30px;
}

header h1{font-size:28px}
header span{color:var(--cyan)}
header a{color:var(--cyan);text-decoration:none}

.main{
  display:grid;
  grid-template-columns:360px 1fr;
  gap:25px;
  align-items:start;
}

.panel{
  background:var(--surface);
  border:1px solid var(--border);
  padding:25px;
  border-radius:16px;
}

.panel h2{margin-bottom:20px;font-size:21px}

label{
  display:block;
  margin:15px 0 7px;
  color:#cbd5e1;
  font-size:14px;
}

input,select,textarea{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #334155;
  background:#080d1b;
  color:white;
  font:inherit;
}

textarea{resize:vertical;min-height:70px}

input:focus,select:focus,textarea:focus{
  outline:1px solid var(--cyan);
  border-color:var(--cyan);
}

button{
  padding:12px 18px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  margin-top:15px;
}

.primary{
  background:linear-gradient(135deg,#5865f2,#2563eb);
  color:white;
}

.secondary{background:#26334d;color:white}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions button{flex:1}

.preview-panel{min-width:0}

.preview-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.preview-toolbar select{max-width:220px}

.card-wrap{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:450px;
  padding:20px;
  background:#080d1b;
  border:1px solid #26334d;
  border-radius:14px;
  overflow:auto;
}

/* ID CARD */

.id-card{
  width:350px;
  min-height:220px;
  background:white;
  color:#172033;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 15px 40px #0006;
  flex-shrink:0;
  font-family:Arial,sans-serif;
  position:relative;
}

.id-card.landscape{width:420px;min-height:260px}

.card-header{
  background:linear-gradient(135deg,#1d4ed8,#38bdf8);
  color:white;
  text-align:center;
  padding:15px;
}

.card-header h3{
  font-size:19px;
  text-transform:uppercase;
  overflow-wrap:anywhere;
}

.card-header p{font-size:10px;margin-top:5px;letter-spacing:2px}

.card-content{
  display:flex;
  padding:18px;
  gap:15px;
  align-items:center;
}

.photo{
  width:90px;
  height:110px;
  object-fit:cover;
  border:2px solid #2563eb;
  border-radius:6px;
  flex-shrink:0;
}

.details{
  font-size:11px;
  line-height:1.8;
  overflow-wrap:anywhere;
  min-width:0;
}

.details strong{
  display:block;
  font-size:16px;
  color:#2563eb;
  margin-bottom:5px;
  text-transform:uppercase;
}

.card-footer{
  background:#eef2ff;
  text-align:center;
  padding:8px;
  font-size:10px;
  color:#475569;
}

.id-card.theme-green .card-header{
  background:linear-gradient(135deg,#047857,#10b981);
}
.id-card.theme-green .photo{border-color:#059669}
.id-card.theme-green .details strong{color:#047857}

.id-card.theme-red .card-header{
  background:linear-gradient(135deg,#991b1b,#ef4444);
}
.id-card.theme-red .photo{border-color:#dc2626}
.id-card.theme-red .details strong{color:#b91c1c}

.id-card.theme-gold .card-header{
  background:linear-gradient(135deg,#854d0e,#eab308);
}
.id-card.theme-gold .photo{border-color:#ca8a04}
.id-card.theme-gold .details strong{color:#a16207}

.id-card.theme-purple .card-header{
  background:linear-gradient(135deg,#581c87,#a855f7);
}
.id-card.theme-purple .photo{border-color:#9333ea}
.id-card.theme-purple .details strong{color:#7e22ce}

.id-card.portrait{
  width:300px;
  min-height:390px;
}

.id-card.portrait .card-content{
  flex-direction:column;
  text-align:center;
}

.id-card.portrait .photo{
  width:110px;
  height:130px;
}

.id-card.portrait .details{text-align:left;width:100%}

.status{
  margin-top:15px;
  font-size:13px;
  color:var(--cyan);
  line-height:1.5;
}

@media(max-width:900px){
  .main{grid-template-columns:1fr}
  .form-panel{order:1}
  .preview-panel{order:2}
}

@media(max-width:500px){
  body{padding:12px}
  .panel{padding:16px}
  .card-wrap{padding:10px;min-height:350px}
  .id-card{transform-origin:center;max-width:100%}
}

/* PRINT */

@media print{
  @page{size:auto;margin:10mm}

  body{background:white;padding:0;color:black}

  header,.form-panel,.preview-toolbar,.print-button,
  .status,.panel>h2{
    display:none!important;
  }

  .container,.main,.preview-panel,.panel{
    display:block;
    width:auto;
    max-width:none;
    margin:0;
    padding:0;
    border:0;
    background:white;
    box-shadow:none;
  }

  .card-wrap{
    min-height:0;
    padding:0;
    border:0;
    background:white;
    overflow:visible;
  }

  .id-card{
    box-shadow:none;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>KK <span>World</span> | ID Card Generator</h1>
  <a href="dashboard.html">← Back to Dashboard</a>
</header>

<div class="main">

<!-- FORM -->

<section class="panel form-panel">

<h2>Customize ID Card</h2>

<label>Card Type</label>
<select id="cardType">
  <option value="School ID">School ID Card</option>
  <option value="College ID">College ID Card</option>
  <option value="Employee ID">Company Employee ID</option>
  <option value="Organization ID">Organization ID</option>
  <option value="Member ID">Membership Card</option>
</select>

<label>Organization Name *</label>
<input id="organization" placeholder="School / Company Name">

<label>Card Subtitle</label>
<input id="subtitle" placeholder="IDENTITY CARD">

<label>Full Name *</label>
<input id="name" placeholder="Enter full name">

<label>ID Number</label>
<input id="idNumber" placeholder="Auto generated">

<label>Designation / Class</label>
<input id="designation" placeholder="Student / Employee">

<label>Department</label>
<input id="department" placeholder="Department / Branch">

<label>Phone Number</label>
<input id="phone" type="tel" placeholder="Phone number">

<label>Date of Birth</label>
<input id="dob" type="date">

<label>Blood Group</label>
<select id="blood">
  <option value="">Not specified</option>
  <option>A+</option><option>A-</option>
  <option>B+</option><option>B-</option>
  <option>AB+</option><option>AB-</option>
  <option>O+</option><option>O-</option>
</select>

<label>Address</label>
<textarea id="address" placeholder="Enter address"></textarea>

<label>Photo</label>
<input id="photoInput" type="file" accept="image/*">

<label>Card Layout</label>
<select id="layout">
  <option value="landscape">Landscape</option>
  <option value="portrait">Portrait</option>
</select>

<label>Card Theme</label>
<select id="theme">
  <option value="blue">Royal Blue</option>
  <option value="green">Emerald Green</option>
  <option value="red">Professional Red</option>
  <option value="gold">Premium Gold</option>
  <option value="purple">Royal Purple</option>
</select>

<div class="actions">
  <button class="primary" onclick="updateCard()">Update Card</button>
  <button class="secondary" onclick="resetForm()">Reset</button>
</div>

<p class="status" id="status"></p>

</section>

<!-- PREVIEW -->

<section class="panel preview-panel">

<div class="preview-toolbar">
  <h2>ID Card Preview</h2>
  <select id="previewScale">
    <option value="1">100% Preview</option>
    <option value="0.9">90% Preview</option>
    <option value="0.75">75% Preview</option>
  </select>
</div>

<div class="card-wrap">

<div class="id-card" id="idCard">

  <div class="card-header">
    <h3 id="previewOrg">KK WORLD</h3>
    <p id="previewSubtitle">IDENTITY CARD</p>
  </div>

  <div class="card-content">

    <img id="previewPhoto" class="photo"
      src="https://placehold.co/200x250/e2e8f0/64748b?text=PHOTO"
      alt="ID photo">

    <div class="details">
      <strong id="previewName">YOUR NAME</strong>

      <div>ID: <span id="previewId">KKW-000001</span></div>
      <div>Type: <span id="previewType">School ID</span></div>
      <div>Role: <span id="previewDesignation">Student</span></div>
      <div>Department: <span id="previewDepartment">-</span></div>
      <div>Phone: <span id="previewPhone">-</span></div>
      <div>DOB: <span id="previewDob">-</span></div>
      <div>Blood: <span id="previewBlood">-</span></div>
      <div id="previewAddress">Address: -</div>
    </div>

  </div>

  <div class="card-footer">
    KK WORLD • DIGITAL IDENTITY
  </div>

</div>

</div>

<div class="actions print-button">
  <button class="primary" onclick="printCard()">🖨️ Print / Save PDF</button>
  <button class="primary" onclick="downloadCardPNG()">🖼️ Download ID Card PNG</button>
  <button class="secondary" onclick="downloadCardInfo()">Download Details</button>
</div>

</section>

</div>
</div>

<script>
const $ = id => document.getElementById(id);

let uploadedPhoto = "";
let generatedId = "KKW-" + String(Date.now()).slice(-6);

$("idNumber").value = generatedId;

function updateCard(){

  $("previewOrg").textContent =
    $("organization").value.trim() || "KK WORLD";

  $("previewSubtitle").textContent =
    $("subtitle").value.trim() || $("cardType").value.toUpperCase();

  $("previewName").textContent =
    $("name").value.trim() || "YOUR NAME";

  $("previewId").textContent =
    $("idNumber").value.trim() || generatedId;

  $("previewType").textContent = $("cardType").value;

  $("previewDesignation").textContent =
    $("designation").value.trim() || "-";

  $("previewDepartment").textContent =
    $("department").value.trim() || "-";

  $("previewPhone").textContent =
    $("phone").value.trim() || "-";

  $("previewDob").textContent =
    $("dob").value || "-";

  $("previewBlood").textContent =
    $("blood").value || "-";

  $("previewAddress").textContent =
    "Address: " + ($("address").value.trim() || "-");

  const card = $("idCard");

  card.className = "id-card";

  if($("layout").value === "portrait"){
    card.classList.add("portrait");
  }else{
    card.classList.add("landscape");
  }

  card.classList.add("theme-" + $("theme").value);

  $("status").textContent = "Preview updated successfully.";
}

$("cardType").addEventListener("change",function(){
  $("subtitle").value = this.value.toUpperCase();
  updateCard();
});

document.querySelectorAll(
  "input:not([type=file]),select,textarea"
).forEach(element=>{
  element.addEventListener("input",updateCard);
  element.addEventListener("change",updateCard);
});

$("photoInput").addEventListener("change",function(){

  const file = this.files[0];

  if(!file){
    uploadedPhoto = "";
    return;
  }

  if(!file.type.startsWith("image/")){
    alert("Please select a valid image file.");
    this.value = "";
    return;
  }

  if(file.size > 5 * 1024 * 1024){
    alert("Please select an image smaller than 5 MB.");
    this.value = "";
    return;
  }

  const reader = new FileReader();

  reader.onload = function(event){
    uploadedPhoto = event.target.result;
    $("previewPhoto").src = uploadedPhoto;
    $("status").textContent = "Photo uploaded successfully.";
  };

  reader.readAsDataURL(file);
});

$("previewScale").addEventListener("change",function(){
  $("idCard").style.transform = "scale(" + this.value + ")";
});

function printCard(){

  if(!$("name").value.trim()){
    alert("Please enter the person's name first.");
    $("name").focus();
    return;
  }

  updateCard();
  window.print();
}

function resetForm(){

  document.querySelectorAll(
    "input:not([type=file]),select,textarea"
  ).forEach(element=>element.value="");

  $("cardType").value="School ID";
  $("layout").value="landscape";
  $("theme").value="blue";
  $("previewScale").value="1";

  generatedId="KKW-"+String(Date.now()).slice(-6);
  $("idNumber").value=generatedId;

  $("photoInput").value="";
  uploadedPhoto="";

  $("previewPhoto").src=
    "https://placehold.co/200x250/e2e8f0/64748b?text=PHOTO";

  $("idCard").style.transform="scale(1)";

  updateCard();
  $("status").textContent="Form reset successfully.";
}


async function downloadCardPNG(){
  if(!$("name").value.trim()){
    alert("Please enter the person's name first.");
    $("name").focus();
    return;
  }

  updateCard();

  const portrait = $("layout").value === "portrait";
  const width = portrait ? 900 : 1260;
  const height = portrait ? 1500 : 790;
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");

  const themes = {
    blue:["#1d4ed8","#38bdf8","#2563eb"],
    green:["#047857","#10b981","#059669"],
    red:["#991b1b","#ef4444","#dc2626"],
    gold:["#854d0e","#eab308","#ca8a04"],
    purple:["#581c87","#a855f7","#9333ea"]
  };
  const colors = themes[$("theme").value] || themes.blue;

  // Card background
  ctx.fillStyle="#ffffff";
  ctx.fillRect(0,0,width,height);

  // Header gradient
  const headerHeight = portrait ? 250 : 210;
  const gradient=ctx.createLinearGradient(0,0,width,headerHeight);
  gradient.addColorStop(0,colors[0]);
  gradient.addColorStop(1,colors[1]);
  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,width,headerHeight);

  const org=($("organization").value.trim()||"KK WORLD").toUpperCase();
  const subtitle=($("subtitle").value.trim()||$("cardType").value.toUpperCase()).toUpperCase();
  ctx.textAlign="center";
  ctx.fillStyle="#ffffff";
  ctx.font="bold 44px Arial";
  drawCanvasText(ctx,org,width/2,85,width-80,52);
  ctx.font="22px Arial";
  ctx.fillText(subtitle.slice(0,70),width/2,145);

  const name=($("name").value.trim()||"YOUR NAME").toUpperCase();
  const id=$("idNumber").value.trim()||generatedId;
  const role=$("designation").value.trim()||"-";
  const department=$("department").value.trim()||"-";
  const phone=$("phone").value.trim()||"-";
  const dob=$("dob").value||"-";
  const blood=$("blood").value||"-";
  const address=$("address").value.trim()||"-";

  let photoX,photoY,photoW,photoH,textX,textY,textW;
  if(portrait){
    photoW=300;photoH=350;photoX=(width-photoW)/2;photoY=headerHeight+45;
    textX=75;textY=photoY+photoH+65;textW=width-150;
  }else{
    photoW=260;photoH=330;photoX=75;photoY=headerHeight+55;
    textX=photoX+photoW+55;textY=headerHeight+90;textW=width-textX-60;
  }

  // Photo frame / image
  ctx.fillStyle=colors[2];
  ctx.fillRect(photoX-8,photoY-8,photoW+16,photoH+16);
  ctx.fillStyle="#e2e8f0";
  ctx.fillRect(photoX,photoY,photoW,photoH);

  if(uploadedPhoto){
    try{
      const img=await loadCanvasImage(uploadedPhoto);
      const scale=Math.max(photoW/img.width,photoH/img.height);
      const sw=photoW/scale,sh=photoH/scale;
      const sx=(img.width-sw)/2,sy=(img.height-sh)/2;
      ctx.save();
      ctx.beginPath();ctx.rect(photoX,photoY,photoW,photoH);ctx.clip();
      ctx.drawImage(img,sx,sy,sw,sh,photoX,photoY,photoW,photoH);
      ctx.restore();
    }catch{
      drawPhotoPlaceholder(ctx,photoX,photoY,photoW,photoH);
    }
  }else{
    drawPhotoPlaceholder(ctx,photoX,photoY,photoW,photoH);
  }

  ctx.textAlign="left";
  ctx.fillStyle=colors[2];
  ctx.font="bold 36px Arial";
  drawCanvasText(ctx,name,textX,textY,textW,43);
  ctx.fillStyle="#172033";
  ctx.font="24px Arial";

  const rows=[
    ["ID",id],["Type",$("cardType").value],["Role",role],
    ["Department",department],["Phone",phone],["DOB",dob],
    ["Blood Group",blood],["Address",address]
  ];
  let y=textY+65;
  const lineHeight=42;
  rows.forEach(([label,value])=>{
    const rowText=label+": "+value;
    const lines=wrapCanvasText(ctx,rowText,textW);
    lines.forEach(line=>{
      ctx.fillText(line,textX,y);
      y+=lineHeight;
    });
    y+=6;
  });

  const footerY=height-65;
  ctx.fillStyle="#eef2ff";
  ctx.fillRect(0,footerY,width,height-footerY);
  ctx.textAlign="center";
  ctx.fillStyle="#475569";
  ctx.font="22px Arial";
  ctx.fillText("KK WORLD • DIGITAL IDENTITY",width/2,footerY+40);

  canvas.toBlob(blob=>{
    if(!blob){alert("PNG export failed. Please try again.");return;}
    const url=URL.createObjectURL(blob);
    const link=document.createElement("a");
    link.href=url;
    link.download="KK-World-ID-"+(id.replace(/[^a-z0-9-_]/gi,"_"))+".png";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    $("status").textContent="ID card PNG downloaded successfully.";
  },"image/png");
}

function loadCanvasImage(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=src;
  });
}

function drawCanvasText(ctx,text,x,y,maxWidth,lineHeight){
  wrapCanvasText(ctx,text,maxWidth).forEach(line=>{
    ctx.fillText(line,x,y);
    y+=lineHeight;
  });
}

function wrapCanvasText(ctx,text,maxWidth){
  const words=String(text).split(/\s+/);
  const lines=[];
  let line="";
  words.forEach(word=>{
    const test=line?line+" "+word:word;
    if(ctx.measureText(test).width>maxWidth && line){
      lines.push(line);
      line=word;
    }else{
      line=test;
    }
  });
  if(line)lines.push(line);
  return lines;
}

function drawPhotoPlaceholder(ctx,x,y,w,h){
  ctx.fillStyle="#64748b";
  ctx.textAlign="center";
  ctx.font="bold 30px Arial";
  ctx.fillText("PHOTO",x+w/2,y+h/2);
}

function downloadCardInfo(){

  if(!$("name").value.trim()){
    alert("Please enter the person's name first.");
    return;
  }

  const info = [
    "KK WORLD ID CARD DETAILS",
    "Organization: " + $("organization").value,
    "Name: " + $("name").value,
    "ID: " + $("idNumber").value,
    "Card Type: " + $("cardType").value,
    "Designation: " + $("designation").value,
    "Department: " + $("department").value,
    "Phone: " + $("phone").value,
    "Date of Birth: " + $("dob").value,
    "Blood Group: " + $("blood").value,
    "Address: " + $("address").value
  ].join("\n");

  const blob = new Blob([info],{type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href=url;
  link.download="KK-World-ID-Details.txt";
  link.click();

  URL.revokeObjectURL(url);
}

updateCard();
</script>

</body>
</html>
