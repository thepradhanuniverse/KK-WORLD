<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KK World | My Profile</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#080d1b;color:#f8fafc;min-height:100vh;padding:25px}
.container{max-width:850px;margin:auto}
.header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:30px}
.logo{font-size:27px;font-weight:bold}.logo span{color:#38bdf8}
.btn{border:0;padding:12px 18px;border-radius:9px;background:linear-gradient(135deg,#5865f2,#2563eb);color:white;font-weight:bold;text-decoration:none;cursor:pointer;display:inline-block}
.card{background:#111a2d;border:1px solid #26334d;border-radius:16px;padding:28px;margin-bottom:25px}
h2{margin-bottom:8px}.subtitle{color:#94a3b8;margin-bottom:25px;font-size:14px}
label{display:block;margin:16px 0 8px;font-size:14px}
input{width:100%;padding:13px;background:#080d1b;border:1px solid #334155;border-radius:8px;color:white;outline:none}
input:focus{border-color:#38bdf8}input:disabled{opacity:.65}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.message{margin-top:15px;font-size:14px;line-height:1.5;min-height:18px}
.danger{background:#991b1b}.back{display:inline-block;margin-top:10px;color:#38bdf8;text-decoration:none}
@media(max-width:600px){body{padding:15px}.grid{grid-template-columns:1fr}.card{padding:20px}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">KK <span>World</span></div>
    <a href="dashboard.html" class="btn">Dashboard →</a>
  </div>

  <div class="card">
    <h2>👤 My Profile</h2>
    <p class="subtitle">Manage your personal information.</p>
    <form id="profileForm">
      <div class="grid">
        <div><label for="name">Full Name</label><input id="name" required maxlength="80"></div>
        <div><label for="mobile">Mobile Number</label><input id="mobile" type="tel" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" required></div>
      </div>
      <label for="userId">User ID</label><input id="userId" disabled>
      <label for="organization">Organization</label><input id="organization" maxlength="100">
      <button class="btn" type="submit" style="margin-top:22px">Save Profile</button>
      <p class="message" id="profileMessage" aria-live="polite"></p>
    </form>
  </div>

  <div class="card">
    <h2>🔐 Change Password</h2>
    <p class="subtitle">Update your account password.</p>
    <form id="passwordForm">
      <label for="currentPassword">Current Password</label><input id="currentPassword" type="password" required autocomplete="current-password">
      <label for="newPassword">New Password</label><input id="newPassword" type="password" minlength="8" required autocomplete="new-password">
      <label for="confirmPassword">Confirm New Password</label><input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password">
      <button class="btn" type="submit" style="margin-top:22px">Change Password</button>
      <p class="message" id="passwordMessage" aria-live="polite"></p>
    </form>
  </div>

  <div class="card">
    <h2>📋 Account Information</h2>
    <p class="subtitle">Your KK World account details.</p>
    <p style="margin:12px 0"><strong>User ID:</strong> <span id="accountId"></span></p>
    <p style="margin:12px 0"><strong>Account Type:</strong> Standard User</p>
    <button class="btn danger" id="logoutButton" style="margin-top:20px">Logout</button>
  </div>
  <a href="dashboard.html" class="back">← Back to Dashboard</a>
</div>

<script>
const STORAGE_KEY = "kkworld_accounts";
const SESSION_KEY = "kkworldUser";

function getAccounts(){
  try{
    const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    return Array.isArray(parsed) ? parsed : [];
  }catch{return [];}
}
function saveAccounts(accounts){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts));
}
function showMessage(id,text,type){
  const el=document.getElementById(id);
  el.textContent=text;
  el.style.color=type==="error"?"#fca5a5":"#38bdf8";
}

let user=null;
try{user=JSON.parse(sessionStorage.getItem(SESSION_KEY)||"null");}catch{user=null;}

if(!user || !user.userId){
  window.location.replace("login.html");
}else{
  const accounts=getAccounts();
  const account=accounts.find(a=>a.userId===user.userId);
  if(!account){
    alert("Account not found in this browser. Please login again.");
    sessionStorage.removeItem(SESSION_KEY);
    window.location.replace("login.html");
  }else{
    user.name=account.name||"";
    user.userId=account.userId;
    user.mobile=account.mobile||"";
    user.organization=account.organization||"";
    sessionStorage.setItem(SESSION_KEY,JSON.stringify(user));
    document.getElementById("name").value=user.name;
    document.getElementById("mobile").value=user.mobile;
    document.getElementById("organization").value=user.organization;
    document.getElementById("userId").value=user.userId;
    document.getElementById("accountId").textContent=user.userId;
  }
}

document.getElementById("profileForm").addEventListener("submit",function(e){
  e.preventDefault();
  if(!user||!user.userId)return;
  const name=document.getElementById("name").value.trim();
  const mobile=document.getElementById("mobile").value.trim();
  const organization=document.getElementById("organization").value.trim();
  if(!name){showMessage("profileMessage","Please enter your name.","error");return;}
  if(!/^[0-9]{10}$/.test(mobile)){showMessage("profileMessage","Enter a valid 10-digit mobile number.","error");return;}
  const accounts=getAccounts();
  const account=accounts.find(a=>a.userId===user.userId);
  if(!account){showMessage("profileMessage","Account not found.","error");return;}
  if(accounts.some(a=>a.userId!==user.userId && a.mobile===mobile)){
    showMessage("profileMessage","This mobile number is already used by another account.","error");return;
  }
  account.name=name;account.mobile=mobile;account.organization=organization;
  saveAccounts(accounts);
  user.name=name;user.mobile=mobile;user.organization=organization;
  sessionStorage.setItem(SESSION_KEY,JSON.stringify(user));
  showMessage("profileMessage","Profile updated successfully!");
});

document.getElementById("passwordForm").addEventListener("submit",function(e){
  e.preventDefault();
  if(!user||!user.userId)return;
  const current=document.getElementById("currentPassword").value;
  const newPass=document.getElementById("newPassword").value;
  const confirmPass=document.getElementById("confirmPassword").value;
  if(newPass.length<8){showMessage("passwordMessage","Password must be at least 8 characters.","error");return;}
  if(newPass!==confirmPass){showMessage("passwordMessage","New passwords do not match.","error");return;}
  const accounts=getAccounts();
  const account=accounts.find(a=>a.userId===user.userId);
  if(!account){showMessage("passwordMessage","Account not found.","error");return;}
  if(account.password!==current){showMessage("passwordMessage","Current password is incorrect.","error");return;}
  account.password=newPass;
  saveAccounts(accounts);
  showMessage("passwordMessage","Password changed successfully!");
  document.getElementById("passwordForm").reset();
});

document.getElementById("logoutButton").addEventListener("click",function(){
  sessionStorage.removeItem(SESSION_KEY);
  window.location.href="login.html";
});
</script>
</body>
</html>
