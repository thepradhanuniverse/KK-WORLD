
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KK World | Account</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#080d1b;
  color:#f8fafc;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.container{width:100%;max-width:440px}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:bold;
  margin-bottom:25px;
}

.logo span{color:#38bdf8}

.card{
  background:#111a2d;
  border:1px solid #26334d;
  padding:30px;
  border-radius:18px;
}

.tabs{display:flex;gap:10px;margin-bottom:25px}

.tabs button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:8px;
  background:#1e293b;
  color:#94a3b8;
  cursor:pointer;
}

.tabs button.active{
  background:linear-gradient(135deg,#5865f2,#2563eb);
  color:white;
}

h2{margin-bottom:10px}

.subtitle{
  color:#94a3b8;
  margin-bottom:22px;
  font-size:14px;
}

label{
  display:block;
  margin:15px 0 7px;
  font-size:14px;
}

input{
  width:100%;
  padding:13px;
  background:#080d1b;
  border:1px solid #334155;
  border-radius:8px;
  color:white;
}

button.submit{
  width:100%;
  padding:14px;
  margin-top:22px;
  background:linear-gradient(135deg,#5865f2,#2563eb);
  border:0;
  border-radius:8px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.hidden{display:none!important}

.message{
  margin-top:15px;
  text-align:center;
  color:#38bdf8;
  font-size:14px;
  overflow-wrap:anywhere;
}

.captcha-box{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#080d1b;
  padding:12px;
  border-radius:8px;
  margin-top:8px;
  gap:10px;
}

.captcha-code{
  font-size:22px;
  font-weight:bold;
  letter-spacing:5px;
  font-style:italic;
  color:#38bdf8;
}

.captcha-box button{
  background:#26334d;
  color:white;
  border:0;
  padding:8px;
  border-radius:6px;
  cursor:pointer;
}

.credentials{
  background:#071827;
  border:1px solid #38bdf8;
  border-radius:10px;
  padding:18px;
  margin-top:20px;
  overflow-wrap:anywhere;
}

.credentials p{margin:10px 0}
.credentials strong{color:#38bdf8}

.copy{
  background:#2563eb;
  color:white;
  border:0;
  padding:10px 15px;
  border-radius:7px;
  cursor:pointer;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#38bdf8;
  text-decoration:none;
}

@media(max-width:480px){
  .card{padding:22px}
}
</style>
</head>

<body>

<div class="container">

<div class="logo">KK <span>World</span></div>

<div class="card">

<div class="tabs">
<button id="loginTab" class="active" type="button">Login</button>
<button id="signupTab" type="button">Sign Up</button>
</div>

<!-- LOGIN -->

<form id="loginForm">

<h2>Welcome Back 👋</h2>
<p class="subtitle">Login using your KK World credentials.</p>

<label>User ID</label>
<input id="loginId" placeholder="KKW-100001" required>

<label>Password</label>
<input id="loginPassword" type="password" placeholder="Enter password" required>

<label>Captcha</label>

<div class="captcha-box">
<span class="captcha-code" id="loginCaptcha"></span>
<button type="button" id="refreshLogin">↻ Refresh</button>
</div>

<input id="loginCaptchaInput" placeholder="Enter captcha" required>

<button class="submit" type="submit">Login</button>

<p class="message" id="loginMessage"></p>

</form>

<!-- SIGNUP -->

<form id="signupForm" class="hidden">

<h2>Create Account 🚀</h2>
<p class="subtitle">Create your KK World account.</p>

<label>Full Name *</label>
<input id="signupName" placeholder="Enter full name" required>

<label>Mobile Number *</label>
<input
id="signupMobile"
type="tel"
inputmode="numeric"
maxlength="10"
pattern="[0-9]{10}"
placeholder="10-digit mobile number"
required>

<label>Organization Name (Optional)</label>
<input id="signupOrganization" placeholder="School / Company / Organization">

<label>Captcha</label>

<div class="captcha-box">
<span class="captcha-code" id="signupCaptcha"></span>
<button type="button" id="refreshSignup">↻ Refresh</button>
</div>

<input id="signupCaptchaInput" placeholder="Enter captcha" required>

<button class="submit" type="submit">Create Account</button>

<p class="message" id="signupMessage"></p>

<div id="credentials" class="credentials hidden">

<h3>🎉 Account Created!</h3>
<p>Save your credentials safely.</p>

<p><strong>Name:</strong> <span id="newName"></span></p>
<p><strong>User ID:</strong> <span id="newUserId"></span></p>
<p><strong>Password:</strong> <span id="newPassword"></span></p>

<button type="button" class="copy" id="copyCredentials">
Copy Credentials
</button>

<button type="button" class="submit" id="continueLogin">
Continue to Login
</button>

</div>

</form>

<!-- LOGIN SUCCESS -->

<div id="loginSuccess" class="credentials hidden">

<h3>Login Successful! 🎉</h3>

<p>Welcome to KK World.</p>

<p><strong>Name:</strong> <span id="welcomeName"></span></p>
<p><strong>User ID:</strong> <span id="welcomeId"></span></p>

<button class="submit" type="button" id="openDashboard">
Open Dashboard →
</button>

<button class="submit" type="button" id="logoutButton">
Logout
</button>

</div>

</div>

<a href="index.html" class="back">← Back to KK World</a>

</div>

<script>
const loginForm = document.getElementById("loginForm");
const signupForm = document.getElementById("signupForm");
const loginTab = document.getElementById("loginTab");
const signupTab = document.getElementById("signupTab");

const loginMessage = document.getElementById("loginMessage");
const signupMessage = document.getElementById("signupMessage");

let loginCaptchaValue = "";
let signupCaptchaValue = "";

const STORAGE_KEY = "kkworld_accounts";
const SESSION_KEY = "kkworldUser";

/* ACCOUNT STORAGE */

function getAccounts(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  }catch(error){
    return [];
  }
}

function saveAccounts(accounts){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts));
}

/* CAPTCHA */

function generateCaptcha(type){

  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let captcha = "";

  for(let i=0;i<5;i++){
    captcha += chars[Math.floor(Math.random()*chars.length)];
  }

  if(type==="login"){
    loginCaptchaValue = captcha;
    document.getElementById("loginCaptcha").textContent = captcha;
    document.getElementById("loginCaptchaInput").value = "";
  }else{
    signupCaptchaValue = captcha;
    document.getElementById("signupCaptcha").textContent = captcha;
    document.getElementById("signupCaptchaInput").value = "";
  }
}

/* TAB SWITCHING */

function showLogin(){

  loginForm.classList.remove("hidden");
  signupForm.classList.add("hidden");

  document.getElementById("loginSuccess").classList.add("hidden");

  loginTab.classList.add("active");
  signupTab.classList.remove("active");

  loginMessage.textContent="";
}

function showSignup(){

  signupForm.classList.remove("hidden");
  loginForm.classList.add("hidden");

  document.getElementById("loginSuccess").classList.add("hidden");

  signupTab.classList.add("active");
  loginTab.classList.remove("active");

  signupMessage.textContent="";
}

/* PASSWORD GENERATOR */

function randomPassword(){

  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$";
  let password = "";

  for(let i=0;i<12;i++){
    password += chars[Math.floor(Math.random()*chars.length)];
  }

  return password;
}

/* UNIQUE USER ID */

function generateUserId(){

  const accounts = getAccounts();
  let userId;

  do{
    userId = "KKW-" + Math.floor(100000+Math.random()*900000);
  }while(accounts.some(account => account.userId === userId));

  return userId;
}

/* COPY CREDENTIALS */

document.getElementById("copyCredentials").addEventListener("click",function(){

  const text =
    "KK World Account\n"+
    "Name: "+document.getElementById("newName").textContent+"\n"+
    "User ID: "+document.getElementById("newUserId").textContent+"\n"+
    "Password: "+document.getElementById("newPassword").textContent;

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(()=>alert("Credentials copied!"))
      .catch(()=>alert(text));
  }else{
    alert(text);
  }
});

/* SIGNUP */

signupForm.addEventListener("submit",function(e){

  e.preventDefault();

  const name = document.getElementById("signupName").value.trim();
  const mobile = document.getElementById("signupMobile").value.trim();
  const organization = document.getElementById("signupOrganization").value.trim();
  const captcha = document.getElementById("signupCaptchaInput").value.trim().toUpperCase();

  if(!/^[0-9]{10}$/.test(mobile)){
    signupMessage.textContent = "Enter a valid 10-digit mobile number.";
    return;
  }

  if(captcha !== signupCaptchaValue){
    signupMessage.textContent = "Incorrect captcha. Please try again.";
    generateCaptcha("signup");
    return;
  }

  const accounts = getAccounts();

  /* Prevent duplicate mobile signup */

  if(accounts.some(account => account.mobile === mobile)){
    signupMessage.textContent = "This mobile number already has an account. Please login.";
    generateCaptcha("signup");
    return;
  }

  const userId = generateUserId();
  const password = randomPassword();

  const newAccount = {
    name,
    mobile,
    organization,
    userId,
    password,
    createdAt: new Date().toISOString()
  };

  accounts.push(newAccount);

  try{
    saveAccounts(accounts);
  }catch(error){
    signupMessage.textContent = "Could not save account in this browser.";
    return;
  }

  document.getElementById("newName").textContent = name;
  document.getElementById("newUserId").textContent = userId;
  document.getElementById("newPassword").textContent = password;

  document.getElementById("credentials").classList.remove("hidden");

  signupMessage.textContent = "Account saved successfully in this browser.";

  generateCaptcha("signup");

});

/* CONTINUE TO LOGIN */

document.getElementById("continueLogin").addEventListener("click",function(){

  const userId = document.getElementById("newUserId").textContent;
  const password = document.getElementById("newPassword").textContent;

  showLogin();

  document.getElementById("loginId").value = userId;
  document.getElementById("loginPassword").value = password;

  loginMessage.textContent = "Credentials filled. Enter captcha and login.";

  generateCaptcha("login");

});

/* LOGIN */

loginForm.addEventListener("submit",function(e){

  e.preventDefault();

  const userId = document.getElementById("loginId").value.trim().toUpperCase();
  const password = document.getElementById("loginPassword").value;
  const captcha = document.getElementById("loginCaptchaInput").value.trim().toUpperCase();

  if(captcha !== loginCaptchaValue){

    loginMessage.textContent = "Incorrect captcha. Please try again.";
    generateCaptcha("login");
    return;
  }

  const accounts = getAccounts();

  const account = accounts.find(function(item){
    return item.userId === userId && item.password === password;
  });

  if(!account){

    loginMessage.textContent = "Incorrect User ID or Password.";
    generateCaptcha("login");
    return;
  }

  /* Store current login session */

  sessionStorage.setItem(SESSION_KEY,JSON.stringify({
    name:account.name,
    userId:account.userId
  }));

  loginForm.classList.add("hidden");
  signupForm.classList.add("hidden");

  document.getElementById("loginSuccess").classList.remove("hidden");

  document.getElementById("welcomeName").textContent = account.name;
  document.getElementById("welcomeId").textContent = account.userId;

  loginMessage.textContent="";

});

/* LOGOUT */

document.getElementById("logoutButton").addEventListener("click",function(){

  sessionStorage.removeItem(SESSION_KEY);

  document.getElementById("loginSuccess").classList.add("hidden");

  loginForm.reset();

  showLogin();

  generateCaptcha("login");

  loginMessage.textContent="You have been logged out successfully.";

});

/* DASHBOARD */

document.getElementById("openDashboard").addEventListener("click",function(){

  window.location.href="dashboard.html";

});

/* BUTTONS */

loginTab.addEventListener("click",showLogin);
signupTab.addEventListener("click",showSignup);

document.getElementById("refreshLogin").addEventListener("click",function(){
  generateCaptcha("login");
});

document.getElementById("refreshSignup").addEventListener("click",function(){
  generateCaptcha("signup");
});

/* INITIALIZE */

generateCaptcha("login");
generateCaptcha("signup");

</script>

</body>
</html>
