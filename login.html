<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KK World | Login & Signup</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#080d1b;color:#f8fafc;min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center}
.container{width:100%;max-width:480px}
.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}
.logo{font-size:28px;font-weight:bold}.logo span{color:#38bdf8}
.btn{border:0;padding:12px 18px;border-radius:9px;background:linear-gradient(135deg,#5865f2,#2563eb);color:white;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}
.card{background:#111a2d;border:1px solid #26334d;border-radius:18px;padding:28px}
h1{font-size:25px;margin-bottom:8px}
.subtitle{color:#94a3b8;font-size:14px;line-height:1.6;margin-bottom:22px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#080d1b;padding:5px;border-radius:10px;margin-bottom:22px}
.tab{border:0;border-radius:8px;padding:11px;background:transparent;color:#94a3b8;font-weight:bold;cursor:pointer}
.tab.active{background:#17243b;color:#38bdf8}
label{display:block;margin:15px 0 7px;font-size:14px}
input{width:100%;padding:13px;background:#080d1b;border:1px solid #334155;border-radius:8px;color:white;outline:none}
input:focus{border-color:#38bdf8}
.submit{width:100%;margin-top:22px}
.message{margin-top:15px;font-size:14px;line-height:1.5;min-height:20px}
.message.error{color:#fca5a5}.message.success{color:#67e8f9}
.hidden{display:none!important}
.note{color:#64748b;font-size:12px;line-height:1.5;margin-top:18px}
@media(max-width:500px){body{padding:15px}.card{padding:21px}.header{align-items:flex-start}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">KK <span>World</span></div>
    <a href="index.html" class="btn">Main Website ↗</a>
  </div>

  <div class="card">
    <div class="tabs">
      <button type="button" class="tab active" id="loginTab">Login</button>
      <button type="button" class="tab" id="signupTab">Create Account</button>
    </div>

    <section id="loginSection">
      <h1>Welcome Back 👋</h1>
      <p class="subtitle">Login to access your KK World dashboard.</p>
      <form id="loginForm">
        <label for="loginUser">User ID or Mobile Number</label>
        <input id="loginUser" autocomplete="username" required>
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required>
        <button class="btn submit" type="submit">Login to Dashboard →</button>
        <p class="message" id="loginMessage" aria-live="polite"></p>
      </form>
    </section>

    <section id="signupSection" class="hidden">
      <h1>Create Your Account 🚀</h1>
      <p class="subtitle">Register to start using KK World.</p>
      <form id="signupForm">
        <label for="signupName">Full Name</label>
        <input id="signupName" maxlength="80" autocomplete="name" required>
        <label for="signupMobile">Mobile Number</label>
        <input id="signupMobile" type="tel" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" autocomplete="tel" required>
        <label for="signupOrganization">Organization (Optional)</label>
        <input id="signupOrganization" maxlength="100" autocomplete="organization">
        <label for="signupPassword">Password (minimum 8 characters)</label>
        <input id="signupPassword" type="password" minlength="8" autocomplete="new-password" required>
        <label for="signupConfirm">Confirm Password</label>
        <input id="signupConfirm" type="password" minlength="8" autocomplete="new-password" required>
        <button class="btn submit" type="submit">Create Account →</button>
        <p class="message" id="signupMessage" aria-live="polite"></p>
      </form>
    </section>
  </div>
  <p class="note">Demo version: account data is saved in this browser only. Do not use a real or sensitive password. Secure accounts across devices require a backend.</p>
</div>

<script>
const STORAGE_KEY = "kkworld_accounts";
const SESSION_KEY = "kkworldUser";

function getAccounts(){
  try{
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    return Array.isArray(data) ? data : [];
  }catch{
    return [];
  }
}

function saveAccounts(accounts){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts));
}

function showMessage(id, text, type){
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = "message " + (type || "");
}

function setMode(mode){
  const isLogin = mode === "login";
  document.getElementById("loginSection").classList.toggle("hidden", !isLogin);
  document.getElementById("signupSection").classList.toggle("hidden", isLogin);
  document.getElementById("loginTab").classList.toggle("active", isLogin);
  document.getElementById("signupTab").classList.toggle("active", !isLogin);
}

document.getElementById("loginTab").addEventListener("click", () => setMode("login"));
document.getElementById("signupTab").addEventListener("click", () => setMode("signup"));

function createUserId(accounts){
  let id;
  do{
    id = "KKW-" + Math.floor(100000 + Math.random() * 900000);
  }while(accounts.some(a => a.userId === id));
  return id;
}

function startSession(account){
  const sessionUser = {
    name: account.name || "",
    userId: account.userId,
    mobile: account.mobile || "",
    organization: account.organization || ""
  };
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessionUser));
  window.location.href = "dashboard.html";
}

// If a valid session already exists, take the user to dashboard.
try{
  const existingUser = JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null");
  if(existingUser && existingUser.userId){
    window.location.replace("dashboard.html");
  }
}catch{
  sessionStorage.removeItem(SESSION_KEY);
}

document.getElementById("signupForm").addEventListener("submit", function(e){
  e.preventDefault();

  const name = document.getElementById("signupName").value.trim();
  const mobile = document.getElementById("signupMobile").value.trim();
  const organization = document.getElementById("signupOrganization").value.trim();
  const password = document.getElementById("signupPassword").value;
  const confirmPassword = document.getElementById("signupConfirm").value;

  if(!name){
    showMessage("signupMessage", "Please enter your full name.", "error");
    return;
  }
  if(!/^[0-9]{10}$/.test(mobile)){
    showMessage("signupMessage", "Enter a valid 10-digit mobile number.", "error");
    return;
  }
  if(password.length < 8){
    showMessage("signupMessage", "Password must be at least 8 characters.", "error");
    return;
  }
  if(password !== confirmPassword){
    showMessage("signupMessage", "Passwords do not match.", "error");
    return;
  }

  const accounts = getAccounts();
  if(accounts.some(a => a.mobile === mobile)){
    showMessage("signupMessage", "This mobile number is already registered. Please login.", "error");
    return;
  }

  const account = {
    name,
    mobile,
    organization,
    userId: createUserId(accounts),
    password,
    createdAt: new Date().toISOString()
  };

  accounts.push(account);
  try{
    saveAccounts(accounts);
  }catch{
    showMessage("signupMessage", "Could not save account in this browser.", "error");
    return;
  }

  showMessage("signupMessage", "Account created! Your User ID: " + account.userId, "success");
  startSession(account);
});

document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();

  const loginValue = document.getElementById("loginUser").value.trim();
  const password = document.getElementById("loginPassword").value;
  const accounts = getAccounts();

  const account = accounts.find(a =>
    (a.userId && a.userId.toLowerCase() === loginValue.toLowerCase()) ||
    (a.mobile && a.mobile === loginValue)
  );

  if(!account || account.password !== password){
    showMessage("loginMessage", "Incorrect User ID/mobile number or password.", "error");
    return;
  }

  startSession(account);
});
</script>
</body>
</html>
