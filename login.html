
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KK World | Login & Signup</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#080d1b;
  color:#f8fafc;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:420px;
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:bold;
  margin-bottom:25px;
}

.logo span{color:#38bdf8}

.card{
  background:#111a2d;
  border:1px solid #26334d;
  padding:30px;
  border-radius:18px;
  box-shadow:0 20px 50px #0004;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:25px;
}

.tabs button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#1e293b;
  color:#94a3b8;
  cursor:pointer;
  font-weight:bold;
}

.tabs button.active{
  background:linear-gradient(135deg,#5865f2,#2563eb);
  color:white;
}

h2{
  margin-bottom:10px;
}

.subtitle{
  color:#94a3b8;
  margin-bottom:25px;
  font-size:14px;
}

label{
  display:block;
  margin:15px 0 7px;
  font-size:14px;
}

input{
  width:100%;
  padding:13px;
  background:#080d1b;
  border:1px solid #334155;
  border-radius:8px;
  color:white;
  outline:none;
}

input:focus{
  border-color:#5865f2;
}

.submit{
  width:100%;
  padding:14px;
  margin-top:22px;
  background:linear-gradient(135deg,#5865f2,#2563eb);
  border:none;
  border-radius:8px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.message{
  margin-top:15px;
  font-size:13px;
  text-align:center;
  color:#38bdf8;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#38bdf8;
  text-decoration:none;
}

.hidden{display:none}
</style>
</head>

<body>

<div class="container">

  <div class="logo">KK <span>World</span></div>

  <div class="card">

    <div class="tabs">
      <button id="loginTab" class="active" onclick="showLogin()">Login</button>
      <button id="signupTab" onclick="showSignup()">Sign Up</button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm">

      <h2>Welcome Back 👋</h2>
      <p class="subtitle">Login to your KK World account.</p>

      <label>Email Address</label>
      <input type="email" id="loginEmail" placeholder="Enter your email" required>

      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Enter password" required>

      <button class="submit" type="submit">Login</button>

      <p class="message" id="loginMessage"></p>

    </form>

    <!-- SIGNUP -->
    <form id="signupForm" class="hidden">

      <h2>Create Account 🚀</h2>
      <p class="subtitle">Join KK World today.</p>

      <label>Full Name</label>
      <input type="text" id="signupName" placeholder="Enter full name" required>

      <label>Email Address</label>
      <input type="email" id="signupEmail" placeholder="Enter email" required>

      <label>Password</label>
      <input type="password" id="signupPassword" placeholder="Create password" minlength="8" required>

      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Confirm password" minlength="8" required>

      <button class="submit" type="submit">Create Account</button>

      <p class="message" id="signupMessage"></p>

    </form>

  </div>

  <a href="index.html" class="back">← Back to KK World</a>

</div>

<script>
function showLogin(){
  document.getElementById("loginForm").classList.remove("hidden");
  document.getElementById("signupForm").classList.add("hidden");

  document.getElementById("loginTab").classList.add("active");
  document.getElementById("signupTab").classList.remove("active");
}

function showSignup(){
  document.getElementById("signupForm").classList.remove("hidden");
  document.getElementById("loginForm").classList.add("hidden");

  document.getElementById("signupTab").classList.add("active");
  document.getElementById("loginTab").classList.remove("active");
}

document.getElementById("signupForm").addEventListener("submit",function(e){
  e.preventDefault();

  const password=document.getElementById("signupPassword").value;
  const confirm=document.getElementById("confirmPassword").value;

  if(password!==confirm){
    document.getElementById("signupMessage").textContent=
      "Passwords do not match!";
    return;
  }

  document.getElementById("signupMessage").textContent=
    "Signup UI ready! Backend authentication is not connected yet.";
});

document.getElementById("loginForm").addEventListener("submit",function(e){
  e.preventDefault();

  document.getElementById("loginMessage").textContent=
    "Login UI ready! Backend authentication is not connected yet.";
});
</script>

</body>
</html>
